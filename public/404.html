<style>
@font-face { font-family: 'Archivo'; src: url('/fonts/archivo-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Cousine'; src: url('/fonts/cousine-400.woff2') format('woff2'); font-display: swap; }
:root { --bg: #0b0a09; --ink: #f3eee4; --mute: rgba(243,238,228,.56); --line: rgba(243,238,228,.14); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: 'Archivo', system-ui, sans-serif; display: grid; place-items: center; min-height: 100svh; padding: 24px 16px; }
main { width: min(440px, 100%); }
.chip { width: 100%; aspect-ratio: 5 / 3; border-radius: 14px; background: #404040; box-shadow: inset 0 0 0 1px var(--line); }
.spec { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 2px 0; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.spec b { font-family: 'Cousine', ui-monospace, monospace; font-weight: 400; font-size: 15px; letter-spacing: .06em; }
.spec span { color: var(--mute); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 600; letter-spacing: -.02em; margin: 26px 0 8px; }
p { color: var(--mute); line-height: 1.55; margin: 0 0 24px; font-size: 15px; }
a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
</style>
</head>
<body>
<main>
  <div class="chip" aria-hidden="true"></div>
  <div class="spec"><b>#404040</b><span>Not on the chart</span></div>
  <h1>Nothing was mined here.</h1>
  <p>This page does not exist. The room, the computer and the miner are one click away.</p>

</main>
</body>
