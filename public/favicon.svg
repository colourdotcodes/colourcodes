<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ead6"/><stop offset="1" stop-color="#cdbf9f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".6"/></filter>
  </defs>
  <!-- classic all-in-one: case, tube, the colour mosaic on the glass -->
  <rect x="9" y="3" width="46" height="54" rx="6" fill="url(#case)"/>
  <rect x="9" y="52" width="46" height="9" rx="3" fill="#bfae8c"/>
  <rect x="14" y="8" width="36" height="31" rx="5" fill="#121412"/>
  <g filter="url(#glow)">
    <rect x="18" y="12" width="8" height="7" rx="1.2" fill="#ff6b5b"/>
    <rect x="28" y="12" width="8" height="7" rx="1.2" fill="#ffd166"/>
    <rect x="38" y="12" width="8" height="7" rx="1.2" fill="#7bdc8e"/>
    <rect x="18" y="21" width="8" height="7" rx="1.2" fill="#6ec3ff"/>
    <rect x="28" y="21" width="8" height="7" rx="1.2" fill="#c792ea"/>
    <rect x="38" y="21" width="8" height="7" rx="1.2" fill="#ff8fb1"/>
    <rect x="18" y="30" width="8" height="5" rx="1.2" fill="#9be7d8"/>
    <rect x="28" y="30" width="8" height="5" rx="1.2" fill="#ffa94d"/>
    <rect x="38" y="30" width="8" height="5" rx="1.2" fill="#8fa8ff"/>
  </g>
  <rect x="34" y="45" width="15" height="2.4" rx="1.2" fill="#3a3326" opacity=".75"/>
</svg>
